<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mapa Interactivo Permoda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --success: #28a745;
            --success-dark: #218838;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-active: 0 4px 20px rgba(0,123,255,0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            overflow: hidden;
        }
        
        /* Header Mejorado */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 10px 12px;
            z-index: 1000;
            box-shadow: var(--shadow);
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        /* Botones Premium */
        .btn {
            position: relative;
            padding: 10px 20px;
            border: 2px solid var(--primary);
            border-radius: 25px;
            background: white;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            outline: none;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0,123,255,0.1);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }
        
        .btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-active);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        /* Estado Activo */
        .btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-active);
        }
        
        .btn.active::after {
            content: '✓';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }
        
        /* Botón Completo Especial */
        .btn-full {
            background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
            color: white;
            border-color: var(--success);
        }
        
        .btn-full:hover {
            box-shadow: 0 4px 20px rgba(40,167,69,0.4);
        }
        
        .btn-full.active {
            background: var(--success-dark);
        }
        
        /* Botón Reset */
        .btn-reset {
            background: #f8f9fa;
            color: #6c757d;
            border-color: #dee2e6;
        }
        
        .btn-reset:hover {
            background: #e9ecef;
            color: #495057;
        }
        
        /* Contenedor de Mapa con Zoom/Pan */
        .map-container {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            background: white;
            touch-action: none;
        }
        
        .map-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transition: transform 0.2s ease-out;
            cursor: grab;
        }
        
        .map-viewport.dragging {
            cursor: grabbing;
            transition: none;
        }
        
        /* Capas del Mapa */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        
        .layer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }
        
        /* Jerarquía de Capas */
        .base { z-index: 1; opacity: 1; }
        .overlay { z-index: 2; }
        .full-map { z-index: 10; }
        
        .layer.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        /* Controles de Zoom */
        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .zoom-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .zoom-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }
        
        .zoom-btn:active {
            transform: scale(0.95);
        }
        
        /* Indicador de Zoom */
        .zoom-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .zoom-indicator.show {
            opacity: 1;
        }
        
        /* Responsive para Móviles */
        @media (max-width: 768px) {
            .header {
                padding: 8px;
                gap: 6px;
            }
            
            .btn {
                padding: 8px 14px;
                font-size: 12px;
            }
            
            .map-container {
                top: 60px;
            }
            
            .zoom-controls {
                bottom: 15px;
                right: 15px;
            }
            
            .zoom-btn {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
        
        /* Landscape Móvil - Máxima área de visualización */
        @media (max-height: 500px) and (orientation: landscape) {
            .header {
                padding: 6px 8px;
                gap: 5px;
            }
            
            .btn {
                padding: 6px 12px;
                font-size: 11px;
            }
            
            .map-container {
                top: 48px;
            }
            
            .zoom-controls {
                bottom: 10px;
                right: 10px;
                gap: 6px;
            }
            
            .zoom-btn {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }
        }
        
        /* Loading Animation */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 2000;
        }
        
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header con Controles -->
    <div class="header">
        <button class="btn btn-reset" data-action="reset">
            🔄 Limpiar Mapa
        </button>
        <button class="btn" data-layer="produccion">
            🏭 Producción
        </button>
        <button class="btn" data-layer="distribucion">
            🚚 Distribución
        </button>
        <button class="btn btn-full" data-layer="completo">
            🗺️ Ver Mapa Completo
        </button>
    </div>
    
    <!-- Contenedor de Mapa con Zoom/Pan -->
    <div class="map-container">
        <div class="map-viewport" id="viewport">
            <div class="layer base">
                <img src="images/Base.png" alt="Mapa Base" draggable="false">
            </div>
            <div id="produccion" class="layer overlay">
                <img src="images/Produccion.png" alt="Capa Producción" draggable="false">
            </div>
            <div id="distribucion" class="layer overlay">
                <img src="images/Distribucion.png" alt="Capa Distribución" draggable="false">
            </div>
            <div id="completo" class="layer full-map">
                <img src="images/Completo.jpg" alt="Mapa Completo" draggable="false">
            </div>
        </div>
    </div>
    
    <!-- Controles de Zoom -->
    <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in" title="Acercar">+</button>
        <button class="zoom-btn" id="zoom-reset" title="Restablecer">⌂</button>
        <button class="zoom-btn" id="zoom-out" title="Alejar">−</button>
    </div>
    
    <!-- Indicador de Zoom -->
    <div class="zoom-indicator" id="zoom-indicator"></div>
    
    <script>
        class MapViewer {
            constructor() {
                this.viewport = document.getElementById('viewport');
                this.zoomIndicator = document.getElementById('zoom-indicator');
                
                // Estado del Zoom/Pan
                this.scale = 1;
                this.minScale = 1;
                this.maxScale = 3;
                this.translateX = 0;
                this.translateY = 0;
                
                // Estado de arrastre
                this.isDragging = false;
                this.startX = 0;
                this.startY = 0;
                this.lastTranslateX = 0;
                this.lastTranslateY = 0;
                
                // Touch handling
                this.lastTouchDistance = 0;
                
                this.init();
            }
            
            init() {
                this.setupButtons();
                this.setupZoomControls();
                this.setupPanControls();
                this.setupTouchControls();
            }
            
            setupButtons() {
                document.querySelectorAll('.btn[data-layer]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const layerId = btn.dataset.layer;
                        this.toggleLayer(layerId, btn);
                    });
                });
                
                document.querySelector('.btn[data-action="reset"]').addEventListener('click', () => {
                    this.reset();
                });
            }
            
            toggleLayer(layerId, button) {
                const layer = document.getElementById(layerId);
                
                // Lógica especial para "Mapa Completo"
                if (layerId === 'completo') {
                    const isActive = layer.classList.contains('active');
                    
                    if (!isActive) {
                        // Activar completo y desactivar otros
                        this.deactivateAllLayers();
                        layer.classList.add('active');
                        button.classList.add('active');
                    } else {
                        // Desactivar completo
                        layer.classList.remove('active');
                        button.classList.remove('active');
                    }
                } else {
                    // Para capas overlay (producción/distribución)
                    const completoLayer = document.getElementById('completo');
                    const completoBtn = document.querySelector('.btn[data-layer="completo"]');
                    
                    // Si el mapa completo está activo, desactivarlo primero
                    if (completoLayer.classList.contains('active')) {
                        completoLayer.classList.remove('active');
                        completoBtn.classList.remove('active');
                    }
                    
                    // Toggle la capa seleccionada
                    layer.classList.toggle('active');
                    button.classList.toggle('active');
                }
            }
            
            deactivateAllLayers() {
                document.querySelectorAll('.overlay, .full-map').forEach(layer => {
                    layer.classList.remove('active');
                });
                document.querySelectorAll('.btn[data-layer]').forEach(btn => {
                    btn.classList.remove('active');
                });
            }
            
            reset() {
                this.deactivateAllLayers();
                this.resetZoom();
            }
            
            setupZoomControls() {
                document.getElementById('zoom-in').addEventListener('click', () => this.zoomIn());
                document.getElementById('zoom-out').addEventListener('click', () => this.zoomOut());
                document.getElementById('zoom-reset').addEventListener('click', () => this.resetZoom());
            }
            
            zoomIn() {
                this.setZoom(this.scale + 0.3);
            }
            
            zoomOut() {
                this.setZoom(this.scale - 0.3);
            }
            
            resetZoom() {
                this.scale = 1;
                this.translateX = 0;
                this.translateY = 0;
                this.lastTranslateX = 0;
                this.lastTranslateY = 0;
                this.updateTransform();
                this.showZoomIndicator();
            }
            
            setZoom(newScale) {
                this.scale = Math.max(this.minScale, Math.min(this.maxScale, newScale));
                this.constrainPan();
                this.updateTransform();
                this.showZoomIndicator();
            }
            
            setupPanControls() {
                // Mouse events
                this.viewport.addEventListener('mousedown', (e) => this.startDrag(e));
                document.addEventListener('mousemove', (e) => this.drag(e));
                document.addEventListener('mouseup', () => this.endDrag());
                
                // Prevenir comportamiento por defecto
                this.viewport.addEventListener('dragstart', (e) => e.preventDefault());
            }
            
            setupTouchControls() {
                this.viewport.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: false });
                this.viewport.addEventListener('touchmove', (e) => this.handleTouchMove(e), { passive: false });
                this.viewport.addEventListener('touchend', () => this.handleTouchEnd());
            }
            
            handleTouchStart(e) {
                if (e.touches.length === 1) {
                    this.startDrag(e.touches[0]);
                } else if (e.touches.length === 2) {
                    e.preventDefault();
                    this.lastTouchDistance = this.getTouchDistance(e.touches);
                }
            }
            
            handleTouchMove(e) {
                if (e.touches.length === 1 && this.isDragging) {
                    e.preventDefault();
                    this.drag(e.touches[0]);
                } else if (e.touches.length === 2) {
                    e.preventDefault();
                    const currentDistance = this.getTouchDistance(e.touches);
                    const delta = currentDistance - this.lastTouchDistance;
                    this.setZoom(this.scale + delta * 0.01);
                    this.lastTouchDistance = currentDistance;
                }
            }
            
            handleTouchEnd() {
                this.endDrag();
                this.lastTouchDistance = 0;
            }
            
            getTouchDistance(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }
            
            startDrag(e) {
                if (this.scale <= 1) return; // Solo permitir pan si hay zoom
                
                this.isDragging = true;
                this.viewport.classList.add('dragging');
                this.startX = e.clientX || e.pageX;
                this.startY = e.clientY || e.pageY;
            }
            
            drag(e) {
                if (!this.isDragging) return;
                
                const currentX = e.clientX || e.pageX;
                const currentY = e.clientY || e.pageY;
                
                this.translateX = this.lastTranslateX + (currentX - this.startX);
                this.translateY = this.lastTranslateY + (currentY - this.startY);
                
                this.constrainPan();
                this.updateTransform();
            }
            
            endDrag() {
                if (this.isDragging) {
                    this.isDragging = false;
                    this.viewport.classList.remove('dragging');
                    this.lastTranslateX = this.translateX;
                    this.lastTranslateY = this.translateY;
                }
            }
            
            constrainPan() {
                const maxTranslate = (this.scale - 1) * 200;
                this.translateX = Math.max(-maxTranslate, Math.min(maxTranslate, this.translateX));
                this.translateY = Math.max(-maxTranslate, Math.min(maxTranslate, this.translateY));
            }
            
            updateTransform() {
                this.viewport.style.transform = 
                    `scale(${this.scale}) translate(${this.translateX}px, ${this.translateY}px)`;
            }
            
            showZoomIndicator() {
                const percentage = Math.round(this.scale * 100);
                this.zoomIndicator.textContent = `Zoom: ${percentage}%`;
                this.zoomIndicator.classList.add('show');
                
                clearTimeout(this.indicatorTimeout);
                this.indicatorTimeout = setTimeout(() => {
                    this.zoomIndicator.classList.remove('show');
                }, 1500);
            }
        }
        
        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            new MapViewer();
        });
    </script>
</body>
</html>
